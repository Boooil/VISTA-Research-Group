<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>VISTA CMS — 内容管理后台</title>

</head>
<body>
  <!-- Decap CMS 主脚本（自带 React，预览模板复用同一实例） -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <!-- 预览模板 & 样式 -->
  <link rel="stylesheet" href="/admin/preview-styles.css" />
  <script src="/admin/preview-templates.js"></script>

  <!-- 自定义 author-list widget（团队成员选择 + 自由输入外协作者） -->
  <script src="/admin/author-widget.js"></script>

  <!-- 自定义 creatable-select widget（预设建议 + 自由新增，支持单值/多值） -->
  <script src="/admin/creatable-select-widget.js"></script>

  <!-- 自定义 unique-slug widget（新建时实时查重，防 page bundle 撞名 index-1.md） -->
  <script src="/admin/slug-unique-widget.js"></script>

  <!-- 自定义 bibtex widget（粘贴 BibTeX 或导入 .bib 文件 → frontmatter cite 字段） -->
  <script src="/admin/bibtex-widget.js"></script>
</body>
</html>
