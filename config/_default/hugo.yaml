# =============================================================================
# Hugo Configuration — VISTA Research Group
# =============================================================================
baseURL: "https://vista-research-group.pages.dev/"
title: "VISTA Research Group"
enableGitInfo: false
enableRobotsTXT: true
# 构建未来日期的内容。CMS 用浏览器本地时间(北京 UTC+8)生成 date，
# 而 Cloudflare Pages 构建机用 UTC；中国时间下午发的文章日期会超前 UTC 一天，
# 被 Hugo 默认判为"未来"而跳过列表页。开启此项消除该时区矛盾(本站无定时发布需求)。
buildFuture: true
pagination:
  pagerSize: 10
timeout: "120s"

# Build options
build:
  writeStats: true

# Taxonomies
taxonomies:
  author: authors
  category: categories
  tag: tags
  publication_type: publication_types

# Permalinks
permalinks:
  post: "/post/:slug/"
  project: "/project/:slug/"
  publication: "/publication/:slug/"
  authors: "/author/:slug/"

# Custom output: slug-manifest.json (URL slug → 内容文件夹名映射)
# 供边缘渲染器 (functions/[[path]].js) 将真实 URL slug 解析回 GitHub 内容文件夹。
# 详见 docs/edge-rendering-design.md 与 layouts/index.slugmanifest.json
mediaTypes:
  application/slug-manifest+json:
    suffixes:
      - json
  application/x-bibtex:
    suffixes:
      - bib
outputFormats:
  SLUGMANIFEST:
    mediaType: application/slug-manifest+json
    baseName: slug-manifest
    isPlainText: true
    notAlternative: true
  # 从 publication 的 frontmatter cite 字段生成 cite.bib(供下载 + 兼容旧链接)
  BIBTEX:
    mediaType: application/x-bibtex
    baseName: cite
    isPlainText: true
    notAlternative: true
outputs:
  home:
    - HTML
    - RSS
    - SLUGMANIFEST

# Module configuration — HugoBlox via Hugo Modules
module:
  hugoVersion:
    extended: true
    min: "0.148.2"
  imports:
    - path: github.com/HugoBlox/hugo-blox-builder/modules/blox-tailwind

# Markup
markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - - \[
              - \]
            - - $$
              - $$
          inline:
            - - \(
              - \)
            - - $
              - $
  highlight:
    style: "dracula"
  tableOfContents:
    endLevel: 3
    startLevel: 2

# Sitemap
sitemap:
  changefreq: weekly
  priority: 0.5

# Related content
related:
  threshold: 80
  includeNewer: true
  toLower: true
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 70

# Image processing quality
imaging:
  quality: 90
  resampleFilter: "Lanczos"

# Cascade front matter for sections
cascade:
  - target:
      path: "/publication"
    view: citation
  - target:
      path: "/post"
    view: date-title-summary
    columns: "2"
  - target:
      path: "/project"
    type: widget_page
    view: card
    columns: "2"

# Minification
minify:
  tdewolff:
    html:
      keepWhitespace: false
